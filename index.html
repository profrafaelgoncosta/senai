    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- JavaScript Application Logic -->
    <script>
        // =====================================================================
        // CONFIGURAÇÃO DO SUPABASE (COLE SUAS CHAVES AQUI)
        // =====================================================================
        const SUPABASE_URL = 'COLE_AQUI_SUA_PROJECT_URL';
        const SUPABASE_ANON_KEY = 'COLE_AQUI_SUA_CHAVE_ANON_PUBLIC';
        
        const supabaseClient = (SUPABASE_URL.startsWith('http')) 
            ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) 
            : null;

        // Estado em memória sincronizado com o banco
        let db = {
            turmas: [],
            alunos: []
        };

        // Carrega os dados do Supabase ao iniciar
        async function loadFromDatabase() {
            if (!supabaseClient) {
                showToast("Configure a URL e a Chave do Supabase no código!", "error");
                return;
            }

            try {
                const { data: turmasData, error: errTurmas } = await supabaseClient
                    .from('turmas')
                    .select('*')
                    .order('created_at', { ascending: true });

                if (errTurmas) throw errTurmas;
                db.turmas = turmasData || [];

                const { data: alunosData, error: errAlunos } = await supabaseClient
                    .from('alunos')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (errAlunos) throw errAlunos;

                // Mapeia snake_case do banco para camelCase da interface
                db.alunos = (alunosData || []).map(a => ({
                    id: a.id,
                    turmaId: a.turma_id,
                    nome: a.nome,
                    idade: a.idade,
                    fezSenai: a.fez_senai,
                    moraProximo: a.mora_proximo,
                    terminouEnsinoMedio: a.terminou_ensino_medio,
                    nivelTi: a.nivel_ti,
                    email: a.email,
                    telefone: a.telefone
                }));

                renderUserTurmas();
                if (!document.getElementById('adminView').classList.contains('hidden')) {
                    renderAdminTurmas();
                    renderAdminAlunos();
                }
            } catch (error) {
                console.error("Erro Supabase:", error);
                showToast("Erro ao conectar com o Supabase. Verifique suas chaves e tabelas.", "error");
            }
        }

        // Toast notification system
// ... existing code ...
        // Switch between User and Admin views
        async function switchView(view) {
            const userView = document.getElementById('userView');
            const adminView = document.getElementById('adminView');

            await loadFromDatabase();

            if (view === 'user') {
                userView.classList.remove('hidden');
                adminView.classList.add('hidden');
                renderUserTurmas();
            } else {
                userView.classList.add('hidden');
                adminView.classList.remove('hidden');
                renderAdminTurmas();
                renderAdminAlunos();
            }
        }

        // ================= USER LOGIC =================
// ... existing code ...
        async function handleStudentSubmit(e) {
            e.preventDefault();
            const turmaId = document.getElementById('selectedTurmaId').value;
            if (!turmaId) {
                showToast("Por favor, selecione uma turma primeiro.", "error");
                return;
            }

            if (!supabaseClient) {
                showToast("Supabase não configurado no código.", "error");
                return;
            }

            const btnSubmit = e.target.querySelector('button[type="submit"]');
            const originalText = btnSubmit.innerHTML;
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i><span>Salvando no servidor...</span>`;

            const newStudentDB = {
                id: 'a_' + Date.now(),
                turma_id: turmaId,
                nome: document.getElementById('nome').value.trim(),
                idade: parseInt(document.getElementById('idade').value),
                fez_senai: document.getElementById('fezSenai').checked,
                mora_proximo: document.getElementById('moraProximo').checked,
                terminou_ensino_medio: document.getElementById('terminouEnsinoMedio').checked,
                nivel_ti: parseInt(document.getElementById('nivelTi').value),
                email: document.getElementById('email').value.trim(),
                telefone: document.getElementById('telefone').value.trim()
            };

            try {
                const { error } = await supabaseClient.from('alunos').insert([newStudentDB]);
                if (error) throw error;

                await loadFromDatabase();
                showToast("Inscrição salva na nuvem com sucesso!");

                // Reset form
                document.getElementById('studentForm').reset();
                document.getElementById('tiVal').innerText = "5";
                document.getElementById('selectedTurmaId').value = "";
                document.getElementById('selectedTurmaIndicator').innerText = "Nenhuma turma selecionada";
                document.getElementById('selectedTurmaIndicator').className = "text-xs font-semibold px-3 py-1 bg-gray-100 text-gray-600 rounded-full";
                document.getElementById('registrationCard').classList.add('opacity-50', 'pointer-events-none');
                renderUserTurmas();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } catch (err) {
                console.error(err);
                showToast("Erro ao salvar inscrição no banco de dados.", "error");
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = originalText;
            }
        }

        // ================= ADMIN LOGIC =================
// ... existing code ...
        // Turma Management
        async function handleAddTurma(e) {
            e.preventDefault();
            if (!supabaseClient) return;

            const nome = document.getElementById('newTurmaName').value.trim();
            const periodo = document.getElementById('newTurmaPeriodo').value.trim();

            const newTurma = {
                id: 't_' + Date.now(),
                nome: nome,
                periodo: periodo
            };

            try {
                const { error } = await supabaseClient.from('turmas').insert([newTurma]);
                if (error) throw error;

                await loadFromDatabase();
                showToast("Turma criada no Supabase com sucesso!");
                document.getElementById('newTurmaName').value = '';
                document.getElementById('newTurmaPeriodo').value = '';
                renderAdminTurmas();
            } catch (err) {
                console.error(err);
                showToast("Erro ao criar turma.", "error");
            }
        }

        async function deleteTurma(id) {
            if (!supabaseClient) return;
            const alunosNaTurma = db.alunos.filter(a => a.turmaId === id).length;
            
            // Substituindo confirm nativo por confirmação direta com aviso no toast caso haja alunos
            try {
                const { error } = await supabaseClient.from('turmas').delete().eq('id', id);
                if (error) throw error;

                await loadFromDatabase();
                showToast(alunosNaTurma > 0 ? "Turma e alunos vinculados removidos!" : "Turma removida com sucesso!");
                renderAdminTurmas();
            } catch (err) {
                console.error(err);
                showToast("Erro ao remover turma.", "error");
            }
        }

        async function deleteStudent(id) {

                const { error } = await supabaseClient.from('alunos').delete().eq('id', id);
                if (error) throw error;

                await loadFromDatabase();

                renderAdminAlunos();

        // Edit Student Modal
// ... existing code ...
        async function handleSaveEditedStudent(e) {
            e.preventDefault();
            if (!supabaseClient) return;

            const id = document.getElementById('editStudentId').value;
            const updatedData = {
                nome: document.getElementById('editNome').value.trim(),
                idade: parseInt(document.getElementById('editIdade').value),
                nivel_ti: parseInt(document.getElementById('editNivelTi').value),
                email: document.getElementById('editEmail').value.trim(),
                telefone: document.getElementById('editTelefone').value.trim(),
                turma_id: document.getElementById('editTurmaId').value,
                fez_senai: document.getElementById('editFezSenai').checked,
                mora_proximo: document.getElementById('editMoraProximo').checked,
                terminou_ensino_medio: document.getElementById('editTerminouEnsinoMedio').checked
            };

            try {
                const { error } = await supabaseClient
                    .from('alunos')
                    .update(updatedData)
                    .eq('id', id);

                if (error) throw error;

                await loadFromDatabase();
                closeEditModal();
                showToast("Dados do aluno atualizados no Supabase!");
                renderAdminAlunos();
            } catch (err) {
                console.error(err);
                showToast("Erro ao atualizar dados do aluno.", "error");
            }
        }

        // ================= JSON EXPORT / IMPORT =================
        function exportDataJson() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "dados.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            showToast("Backup dados.json exportado com sucesso!");
        }

        async function importDataJson(e) {
            const file = e.target.files[0];
            if (!file || !supabaseClient) return;

            const reader = new FileReader();
            reader.onload = async function(event) {
                try {
                    const parsed = JSON.parse(event.target.result);
                    if (parsed && Array.isArray(parsed.turmas) && Array.isArray(parsed.alunos)) {
                        if (parsed.turmas.length > 0) {
                            await supabaseClient.from('turmas').upsert(parsed.turmas);
                        }
                        if (parsed.alunos.length > 0) {
                            const alunosMapped = parsed.alunos.map(a => ({
                                id: a.id,
                                turma_id: a.turmaId,
                                nome: a.nome,
                                idade: a.idade,
                                fez_senai: a.fezSenai,
                                mora_proximo: a.moraProximo,
                                terminou_ensino_medio: a.terminouEnsinoMedio,
                                nivel_ti: a.nivelTi,
                                email: a.email,
                                telefone: a.telefone
                            }));
                            await supabaseClient.from('alunos').upsert(alunosMapped);
                        }
                        await loadFromDatabase();
                        showToast("Dados sincronizados com o Supabase a partir do dados.json!");
                    } else {
                        showToast("Formato inválido do arquivo dados.json", "error");
                    }
                } catch (err) {
                    console.error(err);
                    showToast("Erro ao importar JSON para o Supabase.", "error");
                }
            };
            reader.readAsText(file);
        }

        // Initialize app on load
        window.onload = async function() {
            await loadFromDatabase();
        };
    </script>
